# ingressClassName is a guess (Traefik is k3s' default) - adjust to match your cluster's actual
# ingress controller before applying.
#
# host/path intentionally deviate from the code-rag-api.home.arpa (subdomain-per-service)
# convention used by other services in this cluster: this service is routed via a shared host
# (blogdoft.home.arpa) under the shared /code-brain path instead. /code-brain is stripped by the
# code-ciir-indexer-strip-code-brain Middleware (middleware.yaml) before forwarding, since the
# backend's controllers are rooted at "api/indexer/..." (see Ciir.Indexer.Api Controllers) with no
# "code-brain" segment. Format for router.middlewares: <namespace>-<middleware-name>@kubernetescrd
# (this Ingress is deployed into code-brain - see service.yaml's serverstransport annotation).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-ciir-indexer
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: code-brain-code-ciir-indexer-strip-code-brain@kubernetescrd
spec:
  ingressClassName: traefik
  # Serve the blogdoft.home.arpa certificate requested by code-rag-front's Ingress
  # (cert-manager annotation there). No annotation here on purpose: several Ingresses
  # requesting the same secret would make cert-manager fight over it. The *.home.arpa
  # wildcard alone is rejected by Edge/Chrome because home.arpa is a public suffix.
  tls:
    - hosts:
        - blogdoft.home.arpa
      secretName: blogdoft-tls
  rules:
    - host: blogdoft.home.arpa
      http:
        paths:
          - path: /code-brain/api/indexer
            pathType: Prefix
            backend:
              service:
                name: code-ciir-indexer
                port:
                  name: http
---
# Public exposure through the Cloudflare Tunnel (k3s-apps: artifacts/platform/cloudflare-tunnel). DNS and the
# certificate come from the code-rag-front-public Ingress, which owns the blogdoft.dev host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-ciir-indexer-public
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: code-brain-code-ciir-indexer-strip-code-brain@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: blogdoft.dev
      http:
        paths:
          - path: /code-brain/api/indexer
            pathType: Prefix
            backend:
              service:
                name: code-ciir-indexer
                port:
                  name: http
