# Non-secret settings only - see src/CodeCiir.Api/appsettings.json for defaults.
# ConnectionStrings__Database is injected separately from the code-ciir-secrets Secret
# (see deployment.yaml) - read-only credentials, since this API never writes to code3rag
# except the additive code_query_feedback table (see .specs/06-code-query-feedback.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-ciir-indexer-config
data:
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_ENVIRONMENT: "Production"
  # Swagger/OpenAPI is always mapped regardless of environment (Program.cs), so this is the only
  # thing telling the app it's reachable through the blogdoft.home.arpa/code-brain ingress prefix
  # (which the app otherwise has no way to see - Traefik strips it before forwarding, see
  # .eng/k8s/middleware.yaml) - used to build the OpenAPI document's "servers" entry so Swagger
  # UI's "Try it out" requests land on a real, resolvable URL. Left unset locally, where the
  # current request's own scheme/host stand in for it instead.
  PublicBaseUrl: "https://blogdoft.home.arpa/code-brain"
  # Same shared Ollama instance code-rag-api already uses for embeddings. Model/Dimensions are
  # set here (not per-project): ciir_documents.embedding has one fixed vector width for the
  # whole code3rag installation, so every code-queries question is embedded with this single
  # app-wide model - see .specs/09-code-queries-filters.md.
  Embeddings__Provider: "Ollama"
  Embeddings__BaseUrl: "http://192.168.1.212:11434"
  Embeddings__TimeoutSeconds: "30"
  Embeddings__Model: "bge-m3"
  Embeddings__Dimensions: "1024"
  # Reranking of vector-search candidates, on by default in this cluster - same shared Ollama
  # instance/model code-rag-api already uses for reranking (qwen2.5:7b-instruct, an
  # instruct/chat model - NOT bge-m3, which is embeddings-only and can't be used here). See
  # .specs/10-reranking.md. This is why code-ciir-indexer-transport (serverstransport.yaml) exists:
  # Ollama reranking on CPU (no GPU) can take up to ~90s+ under load.
  Reranking__Provider: "Ollama"
  Reranking__Model: "qwen2.5:7b-instruct"
  Reranking__BaseUrl: "http://192.168.1.212:11434"
  Reranking__TimeoutSeconds: "120"
  Reranking__CandidatePoolSize: "25"
  Reranking__MaxConcurrency: "6"
  # Traces go straight to Tempo through the cluster otel-collector (observability namespace) over
  # OTLP - never to stdout, which is reserved for the structured JSON logs the log collector
  # scrapes. The collector only has a traces pipeline wired to Tempo, whose metrics-generator
  # derives the APM RED metrics (traces_spanmetrics_*) from spans - hence tracing only, no
  # metrics/logs exporter. HttpProtobuf over the collector's plain-HTTP 4318 port avoids the gRPC
  # h2c (unencrypted HTTP/2) opt-in .NET otherwise needs for the 4317 port.
  Observability__OpenTelemetry__UseTracingExporter: "Otlp"
  Observability__OpenTelemetry__UseMetricsExporter: "DoNotUse"
  Observability__OpenTelemetry__UseLogExporter: "DoNotUse"
  Observability__OtlpExporterOptions__Endpoint: "http://otel-collector.observability.svc.cluster.local:4318"
  Observability__OtlpExporterOptions__Protocol: "HttpProtobuf"
  # CIIR upload endpoint (POST /api/ciir-uploads, upload spec §5/§10) - object storage for
  # uploaded CIIR files pending indexation. Endpoint uses the in-cluster Service DNS (this app
  # runs inside the cluster) rather than the minio-api.home.arpa Ingress used for external/local
  # access. AccessKey/SecretKey come from code-ciir-minio-secrets (see deployment.yaml) - a
  # least-privilege user scoped only to the "ciir-uploads" bucket, not the MinIO root user.
  Minio__Endpoint: "minio.minio.svc.cluster.local:9000"
  Minio__UseSsl: "false"
  Minio__BucketName: "ciir-uploads"
  # Keycloak authentication (.specs/05-keycloak-auth.md) - off by default: the API stays open until
  # Keycloak__Enabled is "true". The other Keycloak__* values are IGNORED while it is off, so filling
  # them in does not protect anything by itself. Enabled=true makes every endpoint require a Bearer
  # token (except /health, which the readinessProbe in deployment.yaml calls without one, and
  # Swagger/OpenAPI) and requires Authority - startup fails without it. Audience is optional; leave it
  # unset to accept any audience. No Secret is needed: validating a token only takes the realm's
  # public keys (JWKS). Realm matches code-ciir-api's configmap; ClientId/Audience are the shared
  # "code-brain" client/audience used across the code-brain apps, not a per-app one.
  #
  # MetadataAddress/RequireHttpsMetadata=false: this pod's container image doesn't trust the private
  # CA that signs keycloak.home.arpa's certificate (nothing in this repo installs it), so fetching
  # the discovery document/JWKS from the public Authority over HTTPS fails TLS verification. Keycloak
  # is also reachable in-cluster over plain HTTP via its own Service, and its discovery document
  # reports the same public issuer ("https://keycloak.home.arpa/realms/k8s") regardless of which
  # address served it - so fetching the *discovery document* from there avoids the TLS problem for
  # that one request. Authority itself is untouched and still stays the public URL used for issuer
  # validation and the Swagger "Authorize" button.
  #
  # This alone is NOT enough, though: the discovery document's own `jwks_uri` field is still
  # Keycloak's public https://keycloak.home.arpa (it always reports its own external hostname there,
  # regardless of which address served the document), so the actual signing-key fetch still goes out
  # over HTTPS to the untrusted-CA host and still fails - every request 401s, even with a fully valid
  # token. See Keycloak__SkipCertificateValidation below for the actual stopgap.
  Keycloak__Enabled: "true"
  Keycloak__Authority: "https://keycloak.home.arpa/realms/k8s"
  Keycloak__Audience: "code-brain"
  Keycloak__MetadataAddress: "http://keycloak.keycloak.svc.cluster.local:8080/realms/k8s/.well-known/openid-configuration"
  Keycloak__RequireHttpsMetadata: "false"
  # MetadataAddress above only redirects the discovery document fetch - the JWKS URI *inside* that
  # document is still Keycloak's own public https://keycloak.home.arpa, and this pod's container
  # doesn't trust the private CA that signs it, so token signature validation still fails (every
  # request 401s, even with a fully valid token). "true" here is the stopgap that actually fixes
  # that: it skips the certificate check entirely (equivalent to curl -k) so validation succeeds
  # against this cluster's private CA. Turn back to "false" once the CA is trusted properly instead
  # (e.g. mounted into this container's trust store).
  Keycloak__SkipCertificateValidation: "true"
  # Optional: the Keycloak client this application is registered as - a public client (PKCE, no
  # secret) that Swagger UI's Authorize button also logs in with, so the API and Swagger share one
  # client id. See README.md ("Authentication") for the client settings it needs.
  Keycloak__ClientId: "code-brain"
