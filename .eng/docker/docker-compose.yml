# Keeps the Compose project (and therefore existing named volumes) stable after moving this
# file out of the repository root.
name: code-ciir-indexer

# Development-only PostgreSQL + pgvector for the CIIR Indexer.
# Start:  docker compose -f .eng/docker/docker-compose.yml up -d
# Stop:   docker compose -f .eng/docker/docker-compose.yml down          (add -v to also drop the data volume)
#
# Matches the default appsettings.json:
#   Host=localhost;Port=5432;Database=ciir_indexer;Username=postgres;Password=postgres
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ciir-indexer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ciir_indexer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ciir-indexer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ciir_indexer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: a local Ollama server, for exercising the Ollama embedding provider without any
  # cloud dependency. Disabled by default - start it explicitly with:
  #   docker compose -f .eng/docker/docker-compose.yml --profile ollama up -d
  # Pull a model once the container is up, e.g.: docker exec ciir-indexer-ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:latest
    container_name: ciir-indexer-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ciir-indexer-ollama-data:/root/.ollama

  # Garage (S3-compatible object storage) for the CIIR upload endpoint (POST /api/ciir-uploads).
  # Matches the default appsettings.json: Endpoint=localhost:3900, Region=garage, UseSsl=false,
  # BucketName=ciir-uploads. Garage starts empty - run .eng/docker/garage/init.sh once after the
  # first start to assign the node layout, import the development access key and create the bucket.
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: ciir-indexer-garage
    restart: unless-stopped
    ports:
      - "3900:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - ciir-indexer-garage-meta:/var/lib/garage/meta
      - ciir-indexer-garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ciir-indexer-pgdata:
  ciir-indexer-ollama-data:
  ciir-indexer-garage-meta:
  ciir-indexer-garage-data:
